name: precheck

# The checks of `npm run precheck` (scripts/precheck.mjs): the Astro type check, the production build, every sitemap URL, and
# the built site on six devices. The deploy workflow only runs after a push to main, so without this a broken page or a
# cropped cover is found after it is live.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/precheck.yml"
  workflow_dispatch:

concurrency:
  group: precheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"
  PLAYWRIGHT_VERSION: "1.55.0"

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium-${{ runner.os }}

      - name: Install Chromium
        run: uvx --from "playwright==${PLAYWRIGHT_VERSION}" playwright install --with-deps chromium

      - run: npm run precheck
